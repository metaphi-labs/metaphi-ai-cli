[project]
name = "metaphi"
version = "0.1.0"
description = "The Metaphi AI command line: sign in, manage your organization's keys, anonymize traces."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["httpx>=0.28", "mcp>=2.3"]

[project.scripts]
metaphi = "metaphi.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.22"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
